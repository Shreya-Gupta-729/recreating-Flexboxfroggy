<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox & Box Model Frogs Mini-Game</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        height: 100vh;
        background: #43a047;
        color: #e0e0e0;
      }

      #sidebar {
        width: 40%;
        min-width: 350px;
        background: #263238;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        box-shadow: 5px 0 15px rgba(0, 0, 0, 0.3);
        z-index: 10;
        overflow-y: auto;
      }

      #game-board {
        width: 60%;
        position: relative;
        padding: 2rem;
        background: #1e88e5;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #chapter-select {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        background: #37474f;
        color: white;
        border: 2px solid #546e7a;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: bold;
        outline: none;
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      }

      h1 {
        margin-top: 0;
        color: #fff;
        font-size: 1.5rem;
      }

      #instructions {
        font-size: 1.1rem;
        line-height: 1.6;
        margin-bottom: 1.5rem;
      }

      code {
        background: rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        color: #81c784;
        font-size: 1.1rem;
      }

      /* CSS Editor */
      .editor {
        background: #1b272d;
        padding: 15px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 1.2rem;
        color: #fff;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        margin-bottom: 1.5rem;
      }

      .editor pre {
        margin: 0;
        color: #9e9e9e;
      }

      textarea {
        width: 100%;
        background: transparent;
        border: none;
        color: #fff;
        font-family: monospace;
        font-size: 1.2rem;
        outline: none;
        resize: none;
        padding-left: 20px;
        margin: 5px 0;
      }

      button {
        margin-top: auto;
        padding: 15px;
        background: #e53935;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background: #f44336;
      }
      button:disabled {
        background: #546e7a;
        cursor: not-allowed;
        color: #90a4ae;
      }

      #progress {
        font-size: 0.9rem;
        color: #90a4ae;
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #pond-container {
        position: relative;
        width: 100%;
        max-width: 600px;
        aspect-ratio: 1 / 1; /* Keeps the pond perfectly square on all screens */
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }

      #lilypads,
      #pond {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        padding: 15px;
        align-items: flex-start;
      }

      #pond {
        z-index: 2;
      }

      #lilypads {
        z-index: 1;
      }

      .lilypad,
      .frog {
        width: clamp(36px, 8vw, 65px);
        height: clamp(36px, 8vw, 65px);
        flex-shrink: 0;
        object-fit: contain;
      }

      /* Base Box Model Classes to prevent inline style overrides */
      .bm-base {
        background: #263238;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2;
        transition: all 0.3s;
        box-sizing: content-box;
      }
      .bm-pad-10 {
        padding: 10px;
      }
      .bm-pad-20 {
        padding: 20px;
      }
      .bm-pad-30 {
        padding: 30px;
      }

      /* Marks the fixed-size content area so padding's growth is visible and distinct from resizing width/height */
      .content-marker {
        width: 65px;
        height: 65px;
        box-sizing: content-box;
        border: 2px dashed rgba(255, 235, 59, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .win-bounce {
        animation: bounce 0.5s alternate infinite;
      }

      @keyframes bounce {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-15px);
        }
      }

      @media (max-width: 768px) {
        body {
          flex-direction: column;
          height: auto;
          min-height: 100vh;
        }

        #game-board {
          width: 100%;
          padding: 1rem;
          min-height: 320px;
          order: 1;
        }

        /* Moves sidebar/editor below the game board */
        #sidebar {
          width: 100%;
          min-width: auto;
          padding: 1.25rem;
          order: 2;
        }

        #pond-container {
          max-width: 90vw;
          max-height: 90vw;
        }

        .editor,
        textarea {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <select id="chapter-select">
        <option value="flexbox">Chapter 1: Flexbox Layouts</option>
        <option value="boxmodel">Chapter 2: The Box Model</option>
      </select>

      <div id="progress">Level 1 of 15</div>
      <h1 id="level-title">Level 1</h1>
      <div id="instructions"></div>

      <div class="editor">
        <pre id="css-selector">#pond {</pre>
        <textarea
          id="css-input"
          rows="3"
          spellcheck="false"
          autofocus
        ></textarea>
        <pre>}</pre>
      </div>

      <button id="next-btn" disabled>Next Level</button>
    </div>

    <div id="game-board">
      <div id="pond-container">
        <div id="lilypads"></div>
        <div id="pond"></div>
      </div>
    </div>

    <script>
      const FROG_IMG =
        "https://cdn.jsdelivr.net/gh/thomaspark/flexboxfroggy/images/frog-green.svg";
      const LILYPAD_IMG =
        "https://cdn.jsdelivr.net/gh/thomaspark/flexboxfroggy/images/lilypad-green.svg";

      // Data Structure handling both chapters
      const chapters = {
        flexbox: [
          {
            title: "Justify Content",
            instructions:
              "Welcome! Guide the frog to the lilypad on the right by typing <code>justify-content: flex-end;</code> into the editor below.",
            frogCount: 1,
            targetCSS: { "justify-content": "flex-end" },
            lilypadStyles: { "justify-content": "flex-end" },
          },
          {
            title: "Center Alignment",
            instructions:
              "Use <code>justify-content</code> again to put these two frogs perfectly in the center of the pond. Try the value <code>center</code>.",
            frogCount: 2,
            targetCSS: { "justify-content": "center" },
            lilypadStyles: { "justify-content": "center" },
          },
          {
            title: "Space Around",
            instructions:
              "Distribute the frogs evenly with equal space around them using <code>justify-content: space-around;</code>.",
            frogCount: 3,
            targetCSS: { "justify-content": "space-around" },
            lilypadStyles: { "justify-content": "space-around" },
          },
          {
            title: "Space Between",
            instructions:
              "Now the lilypads are pushed to the edges. Use <code>justify-content: space-between;</code> to space the frogs apart.",
            frogCount: 3,
            targetCSS: { "justify-content": "space-between" },
            lilypadStyles: { "justify-content": "space-between" },
          },
          {
            title: "Space Evenly",
            instructions:
              "Ensure the space between the frogs, and the space before the first frog, is exactly the same using <code>justify-content: space-evenly;</code>.",
            frogCount: 3,
            targetCSS: { "justify-content": "space-evenly" },
            lilypadStyles: { "justify-content": "space-evenly" },
          },
          {
            title: "Align Items",
            instructions:
              "The <code>align-items</code> property aligns elements vertically. Move the frogs to the bottom using <code>align-items: flex-end;</code>.",
            frogCount: 3,
            targetCSS: { "align-items": "flex-end" },
            lilypadStyles: { "align-items": "flex-end" },
          },
          {
            title: "Align Center",
            instructions:
              "Center the frogs vertically using <code>align-items: center;</code>.",
            frogCount: 3,
            targetCSS: { "align-items": "center" },
            lilypadStyles: { "align-items": "center" },
          },
          {
            title: "Bullseye",
            instructions:
              "Combine <b>both</b> <code>justify-content</code> and <code>align-items</code> to move the frog to the exact center of the pond.",
            frogCount: 1,
            targetCSS: { "justify-content": "center", "align-items": "center" },
            lilypadStyles: {
              "justify-content": "center",
              "align-items": "center",
            },
          },
          {
            title: "Flex Direction",
            instructions:
              "The <code>flex-direction</code> property defines the direction items are placed. Stack the frogs vertically using <code>flex-direction: column;</code>.",
            frogCount: 3,
            targetCSS: { "flex-direction": "column" },
            lilypadStyles: { "flex-direction": "column" },
          },
          {
            title: "Mind the Gap",
            instructions:
              "Sometimes you just want exact spacing! Use the <code>gap</code> property to put exactly <code>20px</code> of empty space between the frogs.",
            frogCount: 3,
            targetCSS: { gap: "20px" },
            lilypadStyles: { gap: "20px" },
          },
          {
            title: "Direction & Justify",
            instructions:
              "Properties behave differently based on direction. Push the top and bottom frogs to the edges using <code>flex-direction: column;</code> and <code>justify-content: space-between;</code>.",
            frogCount: 3,
            targetCSS: {
              "flex-direction": "column",
              "justify-content": "space-between",
            },
            lilypadStyles: {
              "flex-direction": "column",
              "justify-content": "space-between",
            },
          },
          {
            title: "Flex Wrap",
            instructions:
              "There are too many frogs! Use <code>flex-wrap: wrap;</code> to let them form multiple rows instead of overflowing the pond.",
            frogCount: 15,
            targetCSS: { "flex-wrap": "wrap" },
            lilypadStyles: { "flex-wrap": "wrap" },
          },
          {
            title: "Wrap Reverse",
            instructions:
              "You can also wrap items upwards instead of downwards. Watch them build rows from bottom to top using <code>flex-wrap: wrap-reverse;</code>.",
            frogCount: 15,
            targetCSS: { "flex-wrap": "wrap-reverse" },
            lilypadStyles: { "flex-wrap": "wrap-reverse" },
          },
          {
            title: "Align Content",
            instructions:
              "When wrapping into rows, <code>align-content</code> spaces the rows themselves. Pack them together at the top using <code>flex-wrap: wrap;</code> and <code>align-content: flex-start;</code>.",
            frogCount: 15,
            targetCSS: { "flex-wrap": "wrap", "align-content": "flex-start" },
            lilypadStyles: {
              "flex-wrap": "wrap",
              "align-content": "flex-start",
            },
          },
          {
            title: "The Grand Finale",
            instructions:
              "Bring the whole crowd to the exact middle of the pond using <code>flex-wrap: wrap;</code> and <code>align-content: center;</code>.",
            frogCount: 15,
            targetCSS: { "flex-wrap": "wrap", "align-content": "center" },
            lilypadStyles: { "flex-wrap": "wrap", "align-content": "center" },
          },
        ],
        boxmodel: [
          {
            title: "Size Matters: Width & Height",
            instructions:
              "Every box has a <code>width</code> and a <code>height</code> — they set the box's size directly, with no separate 'content vs. box' distinction to worry about yet. Resize this crate to fill the outline by setting <code>width: 200px;</code> and <code>height: 120px;</code>.",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: { width: "200px", height: "120px" },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:center;">
              <div style="position:absolute; border:3px dashed rgba(255,255,255,0.4); width:200px; height:120px; box-sizing:content-box;"></div>
              <div id="target-box" class="bm-base" style="width: 65px; height: 65px;">
                <img src="${FROG_IMG}" class="frog" style="display:block;">
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "Padding (Inner Space)",
            instructions:
              "The <span style='color:#FFEB3B;'>yellow dashed square</span> marks the frog's content area — it never changes size. <code>padding</code> adds empty space <b>between that content and the edge of the box</b>, growing the box around it. Add <code>padding: 30px;</code> to push the box edge out to the white outline. (This is different from <code>width</code>/<code>height</code>, which resize the box directly — padding only adds a gap.)",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: { padding: "30px" },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:center;">
              <div style="position:absolute; border:3px dashed rgba(255,255,255,0.4); width:125px; height:125px; box-sizing:border-box;"></div>
              <div id="target-box" class="bm-base">
                <div class="content-marker">
                  <img src="${FROG_IMG}" class="frog" style="display:block;">
                </div>
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "Padding on One Side",
            instructions:
              "You can target just one side of the box! The frog's <span style='color:#FFEB3B;'>yellow-outlined</span> content stays put at the top — <code>padding-bottom: 50px;</code> only adds empty space below it, stretching the box down to the white outline.",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: { "padding-bottom": "50px" },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:flex-start; height: 115px;">
              <div style="position:absolute; top:0; border:3px dashed rgba(255,255,255,0.4); width:65px; height:115px; box-sizing:content-box;"></div>
              <div id="target-box" class="bm-base">
                <div class="content-marker">
                  <img src="${FROG_IMG}" class="frog" style="display:block;">
                </div>
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "Border (The Outline)",
            instructions:
              "<code>border</code> wraps around the padding and content. Give this box a border to match the thick outline using <code>border: 15px solid #81C784;</code>.",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: { "border-width": "15px", "border-style": "solid" },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:center;">
              <div style="position:absolute; border:15px dashed rgba(255,255,255,0.4); width:115px; height:115px; box-sizing:border-box;"></div>
              <div id="target-box" class="bm-base bm-pad-10">
                <img src="${FROG_IMG}" class="frog" style="display:block;">
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "Margin (Outer Space)",
            instructions:
              "<code>margin</code> adds invisible space <b>outside</b> the element, pushing other elements away. These two frogs are too close! Push them apart by giving them <code>margin: 30px;</code>.",
            selectorName: ".box {",
            targetClass: "target-box",
            targetCSS: { margin: "30px" },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:absolute; display:flex; gap: 60px;">
              <div style="border:3px dashed rgba(255,255,255,0.4); width:105px; height:105px;"></div>
              <div style="border:3px dashed rgba(255,255,255,0.4); width:105px; height:105px;"></div>
            </div>
            <div style="display:flex; z-index:2;">
              <div class="target-box bm-base bm-pad-20">
                <img src="${FROG_IMG}" class="frog" style="display:block;">
              </div>
              <div class="target-box bm-base bm-pad-20">
                <img src="${FROG_IMG}" class="frog" style="display:block;">
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "Rounding Corners",
            instructions:
              "Use <code>border-radius: 10px;</code> to slightly round the sharp corners of the box.",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: { "border-radius": "10px" },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:center;">
              <div style="position:absolute; border:3px dashed rgba(255,255,255,0.4); border-radius: 10px; width:125px; height:125px; box-sizing:border-box;"></div>
              <div id="target-box" class="bm-base bm-pad-30">
                <img src="${FROG_IMG}" class="frog" style="display:block;">
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "Lilypads are Round",
            instructions:
              "Lilypads are round! Turn the square into a perfect circle using <code>border-radius: 50%;</code>.",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: { "border-radius": "50%" },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:center;">
              <div style="position:absolute; border:3px dashed rgba(255,255,255,0.4); border-radius:50%; width:125px; height:125px; box-sizing:border-box;"></div>
              <div id="target-box" class="bm-base bm-pad-30">
                <img src="${FROG_IMG}" class="frog" style="display:block;">
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "Mix It Up: Padding + Border",
            instructions:
              "Real boxes usually need more than one property at once. The <span style='color:#FFEB3B;'>yellow-outlined</span> content stays fixed size — <code>padding: 20px;</code> opens a gap around it, then <code>border: 8px solid #81C784;</code> wraps a green ring around that gap. Set both to match the outline.",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: {
              padding: "20px",
              "border-width": "8px",
              "border-style": "solid",
            },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:center;">
              <div style="position:absolute; border:8px dashed rgba(255,255,255,0.4); width:121px; height:121px; box-sizing:border-box;"></div>
              <div id="target-box" class="bm-base">
                <div class="content-marker">
                  <img src="${FROG_IMG}" class="frog" style="display:block;">
                </div>
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "Shaping the Lilypad",
            instructions:
              "Combine <code>width</code>, <code>height</code>, and <code>border-radius</code> to turn this square crate into a wide oval lilypad. Use <code>width: 160px;</code>, <code>height: 90px;</code>, and <code>border-radius: 45px;</code>.",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: {
              width: "160px",
              height: "90px",
              "border-radius": "45px",
            },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:center;">
              <div style="position:absolute; border:3px dashed rgba(255,255,255,0.4); border-radius:45px; width:160px; height:90px; box-sizing:content-box;"></div>
              <div id="target-box" class="bm-base" style="width:65px; height:65px;">
                <img src="${FROG_IMG}" class="frog" style="display:block;">
              </div>
            </div>
          </div>
        `,
          },
          {
            title: "The Ultimate Box",
            instructions:
              "The grand finale! Combine everything you've learned to build the perfect lilypad crate: <code>width: 100px;</code>, <code>height: 100px;</code>, <code>padding-bottom: 20px;</code>, <code>border: 5px solid #81C784;</code>, and <code>border-radius: 50%;</code>.",
            selectorName: "#box {",
            targetId: "target-box",
            targetCSS: {
              width: "100px",
              height: "100px",
              "padding-bottom": "20px",
              "border-width": "5px",
              "border-style": "solid",
              "border-radius": "50%",
            },
            html: `
          <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <div style="position:relative; display:flex; justify-content:center; align-items:center;">
              <div style="position:absolute; border:5px dashed rgba(255,255,255,0.4); border-radius:50%; width:110px; height:130px; box-sizing:border-box;"></div>
              <div id="target-box" class="bm-base">
                <img src="${FROG_IMG}" class="frog" style="display:block;">
              </div>
            </div>
          </div>
        `,
          },
        ],
      };

      let currentChapter = "flexbox";
      let currentLevel = 0;

      // DOM Elements
      const pond = document.getElementById("pond");
      const lilypads = document.getElementById("lilypads");
      const cssInput = document.getElementById("css-input");
      const nextBtn = document.getElementById("next-btn");
      const titleEl = document.getElementById("level-title");
      const instructionsEl = document.getElementById("instructions");
      const progressEl = document.getElementById("progress");
      const cssSelectorEl = document.getElementById("css-selector");
      const chapterSelect = document.getElementById("chapter-select");

      // Load a specific level within the current chapter
      function loadLevel(index) {
        const level = chapters[currentChapter][index];
        const totalLevels = chapters[currentChapter].length;

        // Update Text
        progressEl.innerText = `Level ${index + 1} of ${totalLevels}`;
        titleEl.innerText = level.title;
        instructionsEl.innerHTML = level.instructions;
        cssSelectorEl.innerText = level.selectorName || "#pond {";

        // Adjust textarea height
        const propertyCount = Object.keys(level.targetCSS).length;
        cssInput.rows = Math.max(3, propertyCount + 1);

        // Reset Editor and UI
        cssInput.value = "";
        pond.style.cssText = "";
        lilypads.style.cssText = "";
        nextBtn.disabled = true;
        nextBtn.innerText = "Next Level";

        // Clear previous elements
        pond.innerHTML = "";
        lilypads.innerHTML = "";

        if (currentChapter === "flexbox") {
          // Spawn Frogs and Lilypads as Images
          for (const [prop, value] of Object.entries(level.lilypadStyles)) {
            lilypads.style.setProperty(prop, value);
          }
          for (let i = 0; i < level.frogCount; i++) {
            const lily = document.createElement("img");
            lily.src = LILYPAD_IMG;
            lily.className = "lilypad";
            lilypads.appendChild(lily);
            const frog = document.createElement("img");
            frog.src = FROG_IMG;
            frog.className = "frog";
            pond.appendChild(frog);
          }
        } else if (currentChapter === "boxmodel") {
          // Inject the custom HTML for Box Model levels
          pond.innerHTML = level.html;
        }
      }

      // Handle Chapter Switcher
      chapterSelect.addEventListener("change", (e) => {
        currentChapter = e.target.value;
        currentLevel = 0;
        cssInput.disabled = false;
        nextBtn.style.display = "block";
        loadLevel(0);
      });

      // Listen for user typing CSS
      cssInput.addEventListener("input", (e) => {
        const level = chapters[currentChapter][currentLevel];

        if (currentChapter === "flexbox") {
          pond.style.cssText = e.target.value;
        } else if (currentChapter === "boxmodel") {
          // Apply CSS to the specific box(es)
          let targets = [];
          if (level.targetId)
            targets = [document.getElementById(level.targetId)];
          else if (level.targetClass)
            targets = Array.from(
              document.querySelectorAll("." + level.targetClass),
            );

          targets.forEach((t) => {
            if (t) t.style.cssText = e.target.value;
          });
        }
        checkWinCondition();
      });

      // Verify if the user's CSS matches the required target
      function checkWinCondition() {
        const level = chapters[currentChapter][currentLevel];
        let isWinner = true;

        // Determine target elements based on chapter
        let targets = [];
        if (currentChapter === "flexbox") {
          targets = [pond];
        } else {
          if (level.targetId)
            targets = [document.getElementById(level.targetId)];
          else if (level.targetClass)
            targets = Array.from(
              document.querySelectorAll("." + level.targetClass),
            );
        }

        for (let target of targets) {
          if (!target) continue;
          for (let prop in level.targetCSS) {
            const userValue = target.style.getPropertyValue(prop).trim();
            // Compare what the browser computed vs the target
            if (userValue !== level.targetCSS[prop]) {
              isWinner = false;
              break;
            }
          }
        }

        if (isWinner) {
          nextBtn.disabled = false;
          document
            .querySelectorAll(".frog")
            .forEach((f) => f.classList.add("win-bounce"));
        } else {
          nextBtn.disabled = true;
          document
            .querySelectorAll(".frog")
            .forEach((f) => f.classList.remove("win-bounce"));
        }
      }

      // Handle Next Button
      nextBtn.addEventListener("click", () => {
        const currentChapterLevels = chapters[currentChapter];

        if (currentLevel < currentChapterLevels.length - 1) {
          currentLevel++;
          loadLevel(currentLevel);
        } else {
          progressEl.innerText = "Chapter Completed";
          titleEl.innerText = "Great Job!";
          instructionsEl.innerHTML =
            "You have mastered this chapter! Select another chapter from the menu at the top left to keep learning.";
          pond.innerHTML = "";
          lilypads.innerHTML = "";
          cssInput.disabled = true;
          nextBtn.style.display = "none";
        }
      });

      // Initialize Game
      loadLevel(0);
    </script>
  </body>
</html>
